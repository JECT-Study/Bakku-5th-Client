name: CI

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR 방향이 브랜치 전략에 맞는지 검사
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$BASE_REF" in
            main)    allowed='^(staging|hotfix/.+)$' ;          rule='staging, hotfix/*' ;;
            staging) allowed='^develop$' ;                      rule='develop' ;;
            develop) allowed='^(feature|fix|hotfix)/.+$' ;      rule='feature/*, fix/*, hotfix/*' ;;
          esac
          if [[ ! "$HEAD_REF" =~ $allowed ]]; then
            echo "::error::'$HEAD_REF' → '$BASE_REF' PR은 브랜치 전략에 맞지 않습니다. '$BASE_REF'에는 $rule 브랜치만 머지할 수 있습니다."
            exit 1
          fi
          echo "✅ $HEAD_REF → $BASE_REF"

  check:
    name: Lint · Typecheck · Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check
